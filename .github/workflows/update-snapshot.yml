name: Update Daily Snapshot

# 每个工作日 18:30（北京时间 = 10:30 UTC）抓取当日快照并推送。
# 节假日/周末没有新交易日数据时不产生提交。
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 注意：已不再需要 tushare，市值改由东方财富提供（失败会自动退化为权重排序）
      - name: Install Python deps
        run: pip install akshare requests pandas

      - name: Fetch snapshot
        run: python3 -u packages/data/scripts/fetch_snapshot.py

      - name: Prune old snapshots
        # 每份快照约 0.5~2MB，每天留一份一年就是几百 MB，
        # 会让仓库和 CI 越来越慢。保留最近 60 个交易日（约 3 个月）足够回溯。
        run: |
          ls -d data/snapshot_* 2>/dev/null | sort | head -n -60 | while read -r d; do
            echo "清理 $d"
            rm -rf "$d"
          done
          echo "保留快照数：$(ls -d data/snapshot_* 2>/dev/null | wc -l)"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: data/snapshot_*/
          retention-days: 7

      - name: Commit and push
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "每日快照自动更新 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "### 快照更新" >> "$GITHUB_STEP_SUMMARY"
          echo "- 是否产生提交：${{ steps.commit.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          ls -d data/snapshot_* 2>/dev/null | tail -3 >> "$GITHUB_STEP_SUMMARY" || true
