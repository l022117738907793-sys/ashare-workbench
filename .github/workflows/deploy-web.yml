name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 快照更新完成后自动重新部署（push 事件已覆盖，此处为兜底）
  workflow_run:
    workflows: ["Update Daily Snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个 Pages 部署；后到的取消先到的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # GitHub 不允许在 if 里读 secrets，所以先落到 job 级 env 再判断有没有配。
    # 只给 Cloudflare 部署用；没配时下面那一步整步跳过。
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Sync snapshot into web assets
        # 只保留最新一份：运行期只读 latest.json 指向的快照，
        # 历史快照打进 dist 只会浪费 Pages 带宽
        run: node packages/data/scripts/sync_web_data.mjs --keep 1 --trim-days 120

      - name: Build web app
        # 问答代理地址在构建期注入，线上所有访客默认就能用（公开网址，不是密钥）。
        # 用 pages.dev 那个入口而不是 workers.dev：后者在大陆被屏蔽。
        env:
          VITE_HISUI_ENDPOINT: https://ashare-hisui-proxy.pages.dev/ask
        run: npm run build --workspace @aw/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Pages
        # 大陆访问 GitHub Pages 会被限速到约 15 KB/s：stocks.json 2.68 MB 要 178 秒，
        # 首屏几分钟都出不来。pages.dev 在大陆是通的，同一份 dist 实测快约 72 倍
        # （2.48 秒），所以**给大陆访客的真正入口是这一个**。
        # 需要仓库 Secrets 里配 CLOUDFLARE_API_TOKEN（Pages:Edit 权限）与
        # CLOUDFLARE_ACCOUNT_ID；没配就跳过，站点仍然只在 GitHub Pages 上。
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=ashare-workbench --branch=main
